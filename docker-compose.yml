services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - MODEL_PATH=/ml/model.joblib
      - CORS_ORIGINS=http://localhost:5174
    volumes:
      - ./backend:/app
      - ./ml:/ml

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8001
    ports:
      - "5174:80"
    depends_on:
      - backend

  # Retrain the model: docker compose run --rm train
  train:
    build:
      context: ./ml
      dockerfile: Dockerfile
    profiles: ["train"]
    volumes:
      - ./ml:/ml
